<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Slide</title>
  <link rel="stylesheet" href="shared/base.css" />
  <style id="theme-fonts"></style>
  <style id="theme-vars"></style>
  <style>
    .quote-text {
      font-family: var(--type-quote-font-family);
      font-size: var(--type-quote-font-size);
      font-weight: var(--type-quote-font-weight);
      line-height: var(--type-quote-line-height);
      letter-spacing: var(--type-quote-letter-spacing, normal);
      color: var(--color-text-primary);
      text-align: var(--layout-quote-text-align);
      direction: var(--layout-quote-direction);
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .quote-text p {
      width: 100%;
      margin: 0 0 var(--layout-quote-paragraph-spacing, 24px);
    }
    .quote-text p:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>
  <div class="slide" id="slide">
    <div
      class="pos fit-text quote-text"
      id="quote-box"
      data-fit="quoteSlide"
      data-pos="quoteSlide.textPosition"
    >
      <div id="quote-content"></div>
    </div>
    <div id="slide-images" class="hidden"></div>
    <div class="safe-guide" aria-hidden="true">
      <div class="safe-guide-band top"></div>
      <div class="safe-guide-band bottom"></div>
      <div class="safe-guide-side left"></div>
      <div class="safe-guide-side right"></div>
    </div>
  </div>
  <script type="application/json" id="slide-data"></script>
  <script id="tech-icons-data"></script>
  <script src="shared/slide-runtime.js"></script>
</body>
</html>
